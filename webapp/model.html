		<div id="buttonsright">
		    <button id="shelltoggle"
		  onclick="toggleShell()">Optical (Sulfur and Oxygen)</button>
		    <button id="interiortoggle"
		  onclick="toggleInterior()">Near-infared (Sulfer)</button>
			<button id="irontoggle"
		  onclick="toggleIron()">X-ray (iron)</button>
			<button id="knotstoggle"
		  onclick="toggleHighVKnots()">Optical (High Velocity Knots)</button>
			<button id="vectortoggle"
		  onclick="toggleVectors()"> Optical (High Velocity Vectors)</button>
		  	
		    <button id="oivtoggle"
		  onclick="toggleOIV()">OIV</button>
		    <button id="sivtoggle"
		  onclick="toggleSIV()">SIV</button>
			<button id="neiitoggle"
		  onclick="toggleNeII()">NeII</button>
			<button id="siitoggle"
		  onclick="toggleSiII()">SiII</button>
			<button id="ariitoggle"
		  onclick="toggleArII()"> ArII</button>
		</div>
		<div id ="buttonsleft">
			<button id="toggle" onclick="toggleRotate()">Rotate</button>
			<button id="toggle" onclick="toggleSphere()">Sphere</button>
			<button id="toggle" onclick="toggleImage()">Image</button>
		</div>
